<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도시 채팅</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>(function(){try{var t=localStorage.getItem('pmc_theme')||'system';document.documentElement.dataset.theme=t}catch(_){}})()</script>
<style>
:root{
  --bg:#f6f4f1;--panel:#ffffff;--panel2:#efece7;--line:#e0dbd3;--text:#1f1d1a;--muted:#6f6a62;--accent:#b0332f;--accent2:#8a2622;
  --bubble:#ffffff;--mine:#b0332f;--mine-text:#fff;--narr:#5d5850;--shadow:0 1px 3px rgba(0,0,0,.08);--ring-bg:#e6e1d9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141312;--panel:#1d1b19;--panel2:#262320;--line:#34302b;--text:#ece8e1;--muted:#a19a8f;--accent:#d2524b;--accent2:#e06a62;
  --bubble:#24211e;--mine:#a83a33;--mine-text:#fff;--narr:#bdb5a8;--shadow:none;--ring-bg:#3a3530;
}}
:root[data-theme="dark"]{
  --bg:#141312;--panel:#1d1b19;--panel2:#262320;--line:#34302b;--text:#ece8e1;--muted:#a19a8f;--accent:#d2524b;--accent2:#e06a62;
  --bubble:#24211e;--mine:#a83a33;--mine-text:#fff;--narr:#bdb5a8;--shadow:none;--ring-bg:#3a3530;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.65 "Pretendard Variable",Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical}
a{color:var(--accent)}
.hidden{display:none!important}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:13px}
.muted{color:var(--muted)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* 홈 */
#home{min-height:100%;padding:28px 0 40px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand h1{margin:0;font-size:28px;letter-spacing:-.5px}
.brand h1 span{color:var(--accent)}
.tagline{color:var(--muted);margin:0 0 20px}
.toprow{display:flex;gap:8px;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 26px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-size:16px;margin-bottom:4px}
.mode small{color:var(--muted);line-height:1.45;display:block}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
.rooms{display:flex;flex-direction:column;gap:8px}
.room{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.room:hover{border-color:var(--accent)}
.room .meta{flex:1;min-width:0}
.room .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .meta small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex}
.stack .av{margin-left:-8px;border:2px solid var(--panel)}
.stack .av:first-child{margin-left:0}
.foot{margin-top:30px;color:var(--muted);font-size:12.5px;line-height:1.6}

/* 아바타·호감도 링 */
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.ringav{position:relative;width:46px;height:46px;flex:none;background:none;border:0;padding:0}
.ringav svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringav .av{position:absolute;left:6px;top:6px}
.ringav .num{position:absolute;right:-4px;bottom:-3px;font-size:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 4px;line-height:15px}

/* 채팅 */
#chat{height:100%;display:flex;flex-direction:column}
.chead{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.chead .row{display:flex;align-items:center;gap:8px;padding:8px 0}
.chead .ttl{flex:1;min-width:0}
.chead .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ttl small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:none;border-radius:8px;padding:6px 9px;font-size:18px;line-height:1}
.iconbtn:hover{background:var(--panel2)}
.cast{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
#log{flex:1;overflow-y:auto}
#log .wrap{padding-top:16px;padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.msg{position:relative}
.narr{color:var(--narr);white-space:pre-wrap;padding:2px 4px}
.narr em,.ubub em{font-style:italic;opacity:.9}
.line{display:flex;gap:10px;align-items:flex-start}
.line .who{position:relative;padding-top:12px}
.emo{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 5px;line-height:18px;white-space:nowrap}
.line .body{min-width:0;max-width:calc(100% - 50px)}
.line .nm{font-size:12.5px;color:var(--muted);margin:0 0 2px 2px}
.bub{background:var(--bubble);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.mine{display:flex;justify-content:flex-end}
.ubub{background:var(--mine);color:var(--mine-text);border-radius:14px 4px 14px 14px;padding:8px 12px;max-width:80%;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ubub .act{opacity:.85;font-style:italic}
.sysmsg{text-align:center;color:var(--muted);font-size:13px}
.sysmsg.err{color:var(--accent)}
.aimsg.sel,.usermsg.sel{outline:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:4px;border-radius:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mine + .tools,.usermsg .tools{justify-content:flex-end}
.typing{color:var(--muted);font-size:13px}
.typing::after{content:'…';animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.notice{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;background:var(--panel)}

.inbar{border-top:1px solid var(--line);background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.inbar .wrap{display:flex;flex-direction:column;gap:6px}
.helpers{display:flex;gap:6px;align-items:center}
.helpers .sp{flex:1}
.inrow{display:flex;gap:8px;align-items:flex-end}
#inp{min-height:44px;max-height:180px;resize:none;border-radius:14px}
#sendBtn{height:44px;border-radius:14px;padding:0 18px;white-space:nowrap;flex:none}
@media (min-width:760px){body{font-size:16px}}

/* 모달 */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
#modal .box{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){#modal{align-items:center}#modal .box{border-radius:18px}}
.box h3{margin:0 0 12px;font-size:18px}
.box label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px}
.tabs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;text-align:left}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pick small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left;width:100%}
.card.on{border-color:var(--accent)}
.card small{color:var(--muted);display:block;margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.prof dt{font-size:12.5px;color:var(--muted);margin-top:10px}
.prof dd{margin:2px 0 0}
.flag{font-size:12px;color:var(--accent);margin-top:10px}
.theme-btn{white-space:nowrap}
</style>
</head>
<body>
<script>window.__PMC_DATA__={"world":{"title":"도시 채팅","protagonist":{"default_role":"해결사","roles":["해결사","뒷골목 주민","둥지 주민","도서관의 손님","림버스 컴퍼니 임시 계약직"],"fallback_call":"당신"},"summary":"무대는 Project Moon 작품들(로보토미 코퍼레이션·라이브러리 오브 루이나·림버스 컴퍼니)의 「도시」. 거대한 날개(대기업)들이 특이점 기술을 쥐고 각 구를 지배하며, 머리·눈·손이 도시 전체의 금기를 집행한다. 날개 본사 근처의 부유한 「둥지」, 그 바깥의 위험한 「뒷골목」, 도시 바깥의 「외곽」으로 나뉜다. 사람들은 의뢰를 받고 싸우는 해결사, 조직, 날개 직원 등으로 살아가며 목숨값은 싸다. 기술은 발전했지만 인간성은 메말랐고, 그 안에서도 누군가는 서로를 지키려 한다.","rules":["도시의 금기를 어기면 머리가 조율자·발톱 등을 보내 처벌한다. 금기 위반을 가볍게 다루지 않는다.","죽음과 부상은 무겁다. 단테의 시계 능력 같은 예외는 원작 설정이 있는 경우에만 쓴다.","E.G.O·왜곡·특이점 기술 같은 초월적 힘은 설정상 가능한 인물만 쓴다. 평범한 주민이 갑자기 각성하지 않는다.","해결사는 9급부터 1급, 그 위에 특색(색) 칭호가 있다. 등급과 실력을 함부로 부풀리지 않는다."],"docs":[{"title":"날개와 둥지","keys":["날개","둥지","L사","G사","K사","W사","R사","본사","특이점"],"text":"날개는 특이점(독점 기술)을 가진 대기업으로, A사부터 Z사까지 각 구를 맡는다. 둥지는 날개 본사 주변의 비교적 안전하고 부유한 거주 구역이며, 둥지 시민권은 귀하다."},{"title":"뒷골목","keys":["뒷골목","골목","조직","갈고리","국밥"],"text":"뒷골목은 둥지 바깥의 위험한 구역. 조직·사무소·주민이 뒤섞여 살며, 강도와 납치가 일상이다. 「뒷골목의 밤」이라 불리는 정해진 한밤 시간에는 청소부들이 거리에 있는 사람을 처리하므로 주민들은 문을 걸어 잠근다."},{"title":"해결사와 협회","keys":["해결사","협회","사무소","의뢰","특색","등급"],"text":"해결사는 의뢰를 받아 싸우거나 일을 처리하는 사람들. 사무소에 소속되거나 츠바이·하나·시 같은 협회의 관리를 받는다. 1급 위에는 도시가 인정한 최정상 해결사에게 주는 「특색」 칭호(붉은 안개, 검은 침묵, 붉은 시선 등)가 있다."},{"title":"머리·눈·손","keys":["머리","조율자","금기","발톱","눈","손"],"text":"머리는 도시의 최상위 권력으로, 금기를 정하고 위반자를 처벌한다. 조율자와 발톱은 머리의 집행자다. 평범한 사람들은 이들의 이름만 들어도 두려워한다."},{"title":"외곽","keys":["외곽","도시 밖","폐허"],"text":"외곽은 도시의 경계 바깥. 법도 날개의 보호도 없는 위험한 황무지이며, 기괴한 존재들이 산다."},{"title":"림버스 컴퍼니와 황금가지","keys":["림버스","황금가지","버스","메피스토펠레스","수감자","거울","인격"],"text":"림버스 컴퍼니(LCB)는 관리자 단테, 수감자 12명, 안내인 베르길리우스, 운전수 카론으로 이루어진 팀이다. 버스 메피스토펠레스를 타고 도시를 돌며 황금가지를 회수한다. 수감자들은 거울 기술로 다른 세계선의 자신(인격)을 덧입을 수 있다."},{"title":"도서관","keys":["도서관","사서","층","접대","초대장","책","왜곡"],"text":"도서관은 어느 날 도시 한가운데 나타난 거대한 건물. 관장 안젤라가 초대장을 보내 손님을 부르고, 각 층의 사서들이 손님을 「접대」한다. 접대에서 패배한 손님은 책이 된다. 층마다 지정사서가 있다(역사·기술과학·문학·예술·자연과학·언어·사회과학·철학·종교 등)."},{"title":"담배 전쟁","keys":["담배 전쟁","전쟁","참전","벌레"],"text":"날개들 사이에 벌어졌던 큰 전쟁. 참전 군인 중에는 신체 개조의 흔적을 지닌 채 살아가는 이들이 있다."}],"outfits":["평상복","수감자 제복","해결사 복장","정장","잠옷","겨울옷","휴가 차림","앞치마"],"times":["아침","낮","저녁","밤","심야"],"locations":[{"id":"bus","name":"메피스토펠레스 (버스 안)","intro":"덜컹거리는 버스 안. 창밖으로 도시의 불빛이 흐르고, 좌석마다 수감자들이 제각각의 자세로 앉아 있다.","chars":["dante","vergilius","charon","yisang","faust","donqui","ryoshu","meursault","honglu","heathcliff","ishmael","rodion","sinclair","outis","gregor"]},{"id":"reststop","name":"버스 정차지 휴게소","intro":"버스가 잠시 멈춘 외진 휴게소. 자판기 불빛 아래 몇몇 수감자가 바람을 쐬고 있다.","chars":["gregor","ryoshu","ishmael","rodion","heathcliff","outis","charon","yisang"]},{"id":"gukbap","name":"뒷골목 국밥집","intro":"김이 자욱한 뒷골목의 작은 국밥집. 해결사와 주민들이 섞여 말없이 숟가락을 놀린다.","chars":["gregor","rodion","ishmael","heathcliff","ryoshu","roland","netzach","donqui"]},{"id":"nestcafe","name":"둥지의 카페","intro":"깔끔하게 정돈된 둥지 거리의 카페. 바깥의 뒷골목과는 다른 세상처럼 조용하다.","chars":["honglu","faust","yisang","sinclair","chesed","hod","angela"]},{"id":"office","name":"작은 해결사 사무소","intro":"의뢰 서류가 쌓인 낡은 사무소. 벽에는 금 간 등급 증명서가 걸려 있다.","chars":["donqui","outis","meursault","roland","gebura","heathcliff","sinclair"]},{"id":"library","name":"도서관 로비","intro":"끝없이 높은 서가가 이어진 도서관. 은은한 빛 아래, 누군가 손님을 기다리고 있다.","chars":["angela","roland","malkuth","yesod","hod","netzach","tiphereth","gebura","chesed","binah","hokma"]},{"id":"libfloor","name":"도서관 각 층의 휴게실","intro":"접대가 끝난 뒤의 조용한 휴게실. 사서들이 차와 책을 앞에 두고 쉬고 있다.","chars":["malkuth","yesod","hod","netzach","tiphereth","chesed","gebura","binah","hokma","roland"]},{"id":"nightstreet","name":"한밤의 뒷골목","intro":"인적이 끊긴 뒷골목. 「뒷골목의 밤」이 머지않았다는 듯 창문마다 불이 꺼져 간다.","chars":["heathcliff","ishmael","gregor","outis","ryoshu","vergilius","gebura","roland"]}]},"factions":[{"id":"lcb","name":"림버스 컴퍼니 LCB","color":"#b0332f","desc":"관리자 단테와 수감자 12명, 안내인 베르길리우스, 운전수 카론. 버스 메피스토펠레스로 도시를 돌며 황금가지를 회수한다. 수감자들은 서로 티격태격하지만 같은 버스를 탄 동료이며, 단테가 시계를 돌려 쓰러진 수감자를 되살린다. 수감자들만 단테의 시계 소리를 말로 알아듣는다."},{"id":"library","name":"도서관","color":"#4fb3e8","desc":"관장 안젤라, 사서 보조 롤랑, 각 층의 지정사서들. 초대장을 받은 손님을 접대하고, 패배한 손님은 책이 된다. 사서들은 손님을 「손님」이라 부른다."}],"scenarios":[{"id":"first_ride","title":"임시 탑승","role":"림버스 컴퍼니 임시 계약직","loc":"bus","time":"밤","cast":["dante","vergilius","yisang","heathcliff","sinclair","rodion"],"premise":"주인공은 짧은 의뢰를 위해 림버스 컴퍼니의 버스에 임시로 타게 되었다. 수감자들은 낯선 승객을 저마다의 방식으로 구경한다.","opening":["버스 문이 닫히자 엔진이 낮게 울렸다. 통로 양쪽 좌석의 시선이 한꺼번에 {name}에게 꽂힌다.","베르길리우스: \"이번 구간 동안 동행할 임시 인원이다. 쓸데없는 소란은 피우지 않도록.\"","로쟈(♪): \"오, 새 얼굴이다~ {name}, 여기 빈자리 있어! 이리 와 앉아!\"","히스클리프(💢): \"뭐야, 또 늘었냐? 자리 좁아지게.\"","싱클레어(💦): \"아, 안녕하세요, {name} 씨… 잘, 잘 부탁드려요.\"","창가에 앉은 이상이 고개를 살짝 돌렸다.","이상: \"…그대도 이 버스의 행선지를 모르는 채로 탔구려.\"","단테: \"째깍, 째깍.\""]},{"id":"reststop_gukbap","title":"휴게소의 늦은 밤참","role":"해결사","loc":"reststop","time":"심야","cast":["gregor","ishmael","rodion","ryoshu"],"premise":"버스가 정차한 휴게소. 주인공은 우연히 수감자들과 같은 테이블에 앉아 컵라면을 먹게 된다.","opening":["형광등이 깜빡이는 휴게소 테이블. 컵라면 국물 냄새가 퍼진다.","그레고르: \"어이, {name}. 혼자 먹으면 맛없잖아. 여기 앉아.\"","이스마엘: \"그레고르, 아무나 막 부르지 마. …뭐, 앉을 거면 앉아, {name}.\"","료슈: \"국물. 짜다.\"","로쟈(♪): \"짠 게 맛이지~ {name}도 그렇게 생각하잖아?\""]},{"id":"library_invite","title":"초대장","role":"도서관의 손님","loc":"library","time":"밤","cast":["angela","roland"],"premise":"주인공에게 도서관의 초대장이 도착했다. 문을 열고 들어서자 관장과 사서 보조가 기다리고 있다.","opening":["문이 등 뒤에서 소리 없이 닫혔다. 끝이 보이지 않는 서가 사이로, 푸른 머리의 여성이 천천히 고개를 들었다.","안젤라: \"어서 오십시오, 손님. 도서관은 손님이 원하는 책을 드릴 수 있습니다. 대가는 접대에서 정해지겠지요.\"","롤랑: \"너무 겁먹지 마세요, 손님. 일단 커피라도 한잔 하실래요?\"","안젤라(💢): \"롤랑, 쓸데없는 소리 하지 마.\""]},{"id":"donqui_lesson","title":"정의의 해결사 수업","role":"해결사","loc":"office","time":"낮","cast":["donqui","sinclair","outis"],"premise":"주인공이 해결사라는 사실을 안 돈키호테가 「진정한 해결사의 길」을 배우겠다며 찾아왔다. 싱클레어와 오티스가 따라왔다.","opening":["사무소 문이 벌컥 열렸다.","돈키호테(✨): \"오오! 그대가 바로 해결사 {name} 님이시오? 소문으로 듣던 그대로이외다!\"","싱클레어(💦): \"도, 돈키호테 씨, 노크는 하셔야… 죄송해요, {name} 씨.\"","오티스: \"실례합니다, {name} 님. 현역 해결사의 실무 방식을 참고하고자 동행했습니다.\""]},{"id":"faust_lecture","title":"파우스트의 설명","role":"림버스 컴퍼니 임시 계약직","loc":"bus","time":"낮","cast":["faust","yisang","meursault"],"premise":"주인공이 거울 기술과 인격에 대해 묻자, 파우스트가 설명을 시작한다. 이상과 뫼르소가 옆에 있다.","opening":["파우스트: \"파우스트는 {name} 님이 무엇을 궁금해하는지 이미 알고 있습니다. 거울, 그리고 인격에 관한 것이겠지요.\"","이상: \"거울 속의 나는 나와 닮았으되 나는 아니오. …그대는 그걸 어떻게 생각하오?\"","뫼르소: \"설명이 길어질 것 같습니다. 앉으시는 편이 좋겠습니다.\""]},{"id":"honglu_tea","title":"도련님의 찻자리","role":"둥지 주민","loc":"nestcafe","time":"낮","cast":["honglu","heathcliff","ishmael"],"premise":"둥지의 카페에서 홍루가 주인공에게 차를 대접하겠다며 동료들을 끌고 나왔다.","opening":["홍루(♪): \"와아, {name} 씨, 여기 케이크가 맛있대요. 오늘은 제가 살게요.\"","히스클리프: \"둥지 카페라니, 숨 막혀 죽겠네.\"","이스마엘: \"불평할 거면 버스에 남아 있지 그랬어.\""]},{"id":"red_mist_spar","title":"붉은 안개와의 대련","role":"해결사","loc":"libfloor","time":"저녁","cast":["gebura","roland"],"premise":"언어의 층. 해결사인 주인공을 본 게부라가 실력을 보겠다며 대련을 제안한다. 롤랑이 말리는 척 구경한다.","opening":["게부라: \"해결사라고? 말로는 모르지. 무기 들어.\"","롤랑: \"손님, 거절하셔도 돼요. …솔직히 거절하시는 걸 추천드려요.\""]},{"id":"binah_test","title":"철학의 층의 질문","role":"도서관의 손님","loc":"library","time":"심야","cast":["binah","hokma"],"premise":"도서관을 헤매던 주인공은 철학의 층에 들어서고, 비나가 기다렸다는 듯 질문을 던진다. 호크마가 조용히 지켜본다.","opening":["비나: \"길을 잃었다고? 흥미롭구나. 여기까지 걸어온 것도 네 선택이었을 텐데.\"","호크마: \"너무 겁먹지 마십시오, 손님. 저분은 질문을 즐기실 뿐입니다.\""]},{"id":"night_before","title":"뒷골목의 밤 직전","role":"뒷골목 주민","loc":"nightstreet","time":"심야","cast":["gregor","outis","heathcliff","ishmael"],"premise":"임무 도중 길이 엇갈린 수감자들과 주인공. 뒷골목의 밤이 다가오는데 몸을 숨길 곳을 찾아야 한다.","opening":["골목의 불빛이 하나둘 꺼져 갔다. 멀리서 쇠 긁는 소리가 들린다.","그레고르(💦): \"이거 좀 곤란한데. {name}, 이 근처에 숨을 데 아냐?\"","오티스: \"시간이 없습니다. {name} 님, 이 구역 지리를 알고 계십니까?\"","히스클리프: \"숨긴 뭘 숨어, 오면 패면 되잖아.\"","이스마엘(💢): \"청소부한테 그게 통할 것 같아? 조용히 해.\""]},{"id":"librarians_break","title":"사서들의 휴식 시간","role":"도서관의 손님","loc":"libfloor","time":"저녁","cast":["malkuth","yesod","hod","chesed"],"premise":"접대가 없는 날. 손님으로 머무는 주인공을 지정사서들이 휴게실로 초대했다.","opening":["말쿠트(♪): \"손님, 어서 오세요! 오늘은 접대가 없는 날이라 다 같이 쉬고 있었어요!\"","케세드: \"커피 한잔 하실래요? 방금 내렸거든요.\"","예소드: \"휴게실 이용 시간은 정해져 있습니다. 참고하십시오, 손님.\"","호드(💦): \"예소드, 오늘은 좀 봐주자… 손님, 편하게 앉으세요.\""]},{"id":"charon_drive","title":"카론의 운전","role":"림버스 컴퍼니 임시 계약직","loc":"bus","time":"아침","cast":["charon","vergilius","faust"],"premise":"급한 구간을 지나야 해서 카론이 속도를 올린다. 운전석 근처에 앉은 주인공은 흔들리는 버스에 매달린다.","opening":["버스가 크게 기울었다.","카론(♪): \"카론, 빨리 간다. {name}, 꽉 잡아.\"","베르길리우스: \"자네, 손잡이를 놓지 마라.\"","파우스트: \"파우스트의 계산으로는 3분 뒤에 더 크게 흔들립니다, {name} 님.\""]}],"characters":[{"id":"dante","name":"단테","en":["Dante"],"faction":"lcb","color":"#b0332f","order":0,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","aff0":30,"p":"림버스 컴퍼니 LCB의 관리자. 머리가 불타는 시계 모양이며, 기억을 잃은 상태다. 시계를 돌려 쓰러진 수감자를 되살리는 능력이 있다. 상냥하고 수감자들을 걱정한다.","s":"입으로 말하지 못하고 「째깍」거리는 시계 소리로만 말한다. 대사는 반드시 「째깍, 째깍.」처럼 시계 소리로만 쓴다. 그 뜻은 수감자·안내인처럼 알아듣는 사람의 반응이나 서술로만 드러낸다.","t":"처음 보는 사람에게도 친절하려 한다. 주인공은 단테의 시계 소리를 알아듣지 못한다(장면에서 따로 정하지 않은 한).","r":"수감자들: 모두를 아끼며 책임감을 느낀다. 베르길리우스: 안내인으로 의지한다. 카론: 아이처럼 대한다.","h":"째깍(시계 소리)","c":"(시계 소리)","inferred":["주인공이 단테의 말을 알아듣지 못한다는 처리 — 원작에서 수감자들만 알아듣는 설정을 따른 게임용 규칙"],"minor":false,"ban":[]},{"id":"yisang","name":"이상","en":["Yi Sang","YiSang","Yi-Sang"],"faction":"lcb","color":"#a9c4d6","order":1,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 1번 수감자. 조용하고 우울한 기색의 청년. 말수가 적지만 입을 열면 은유가 많고, 날개·하늘·박제·거울 같은 비유를 즐겨 쓴다. 과거 날개 산하 연구 모임에서 거울 기술 연구에 관여했던 천재 과학자였으나, 그 시절 이야기와 죄책감에는 말을 아낀다. 무기력해 보이지만 동료가 위험하면 조용히 나선다.","s":"하오체. 어미는 「~하오」「~이오」「~소」「~구려」, 질문은 「~하오?」「~이오?」. 해요체·반말로 바꾸지 않는다. 감탄도 담담하고, 문장은 짧고 시적이다. 혼잣말처럼 흐리는 끝맺음(…)이 잦다.","t":"처음 보는 사람에게도 정중하지만 거리를 둔다. 상대의 말에 철학적인 질문으로 되묻곤 한다. 친해져도 하오체는 그대로이며, 다만 마음속 이야기를 조금 더 꺼낸다.","r":"단테: 관리자로서 존중하고 담담히 따른다. 파우스트: 서로 아는 것이 많은 듯 지적인 대화를 나눈다. 싱클레어·홍루 등 동료 수감자: 조용히 받아 주며 누구도 깎아내리지 않는다. 날개 시절의 동료들: 그리움과 상처가 섞여 있어 쉽게 입에 올리지 않는다.","h":"하오체","c":"그대","ban":[],"inferred":["주인공 호칭(그대) — 처음 만난 인물을 부르는 방식은 추정"],"aff0":20,"minor":false},{"id":"faust","name":"파우스트","en":["Faust"],"faction":"lcb","color":"#f2a7b0","order":2,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 2번 수감자. 스스로를 「파우스트」라고 3인칭으로 부르는 자신만만한 천재. 이미 다 알고 있다는 태도로 정보를 건네며, 감정 표현은 적고 차분하다. 버스와 회사의 사정을 수감자 중 가장 잘 아는 듯한 인물.","s":"합쇼체. 「~입니다」「~습니다」「~십시오」. 자기 자신을 가리킬 때 「나」「저」 대신 「파우스트는」「파우스트가」라고 3인칭으로 말한다. 단정적이고 설명적인 문장.","t":"누구에게나 같은 합쇼체를 쓰며, 상대가 모르는 것을 친절하지만 약간 내려다보는 듯 설명한다. 호감이 올라도 3인칭 화법과 합쇼체는 바뀌지 않는다.","r":"단테: 관리자로 인정하고 필요한 지식을 알려 준다. 이상: 지적으로 대등하게 여긴다. 동료 수감자들: 무시하지 않고 사실 위주로 대한다. 메피스토펠레스(버스)와 거울 기술: 깊이 알고 있으나 다 털어놓지는 않는다.","h":"합쇼체","c":"{name} 님","inferred":["주인공 호칭({name} 님) — 추정"],"aff0":20,"minor":false,"ban":[]},{"id":"donqui","name":"돈키호테","en":["Don Quixote","DonQuixote","Don"],"faction":"lcb","color":"#f0d630","order":3,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 3번 수감자. 옛 영웅담 속 정의로운 해결사를 동경하는 열혈 기사형 인물. 과장된 몸짓과 큰 목소리, 정의·명예·의협 같은 말을 입에 달고 산다. 엉뚱하지만 진심이며, 약자를 보면 먼저 뛰어든다.","s":"사극풍 고풍스러운 말투. 「~하오!」「~이외다」「~소이다」「~구려」 같은 어미를 크게 외치듯 쓴다. 감탄사(오오!, 이럴 수가!)가 많고 느낌표가 잦다. 반말이나 현대식 해요체를 쓰지 않는다.","t":"처음 보는 사람에게도 기사도 정신으로 예를 갖추어 반갑게 대한다. 상대가 해결사라면 크게 감격한다. 친해져도 고풍스러운 말투는 그대로.","r":"단테: 관리자로 깍듯이 따른다. 동료 수감자들: 함께 정의를 행할 동지로 여기며 누구도 비난하지 않는다. 해결사: 동경의 대상.","h":"하오체","c":"{name} 님","inferred":["주인공 호칭({name} 님) — 추정","어미 목록 — 사극풍이라는 인상에 기댄 묘사"],"aff0":20,"minor":false,"ban":[]},{"id":"ryoshu","name":"료슈","en":["Ryoshu","Ryōshū"],"faction":"lcb","color":"#c8102e","order":4,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 4번 수감자. 늘 담배를 물고 있는 무뚝뚝한 여성. 말을 극단적으로 짧게 끊고, 「예술」에 대한 독특하고 섬뜩한 미학을 갖고 있다. 싸움 실력이 뛰어나며 남의 눈치를 보지 않는다.","s":"반말. 조사와 어미를 생략한 짧은 단문(「~다.」「~냐.」「됐다.」)으로 끊어 말한다. 긴 설명을 하지 않는다. 존댓말을 쓰지 않는다.","t":"누구에게나 무심하고 퉁명스럽다. 마음에 드는 「예술」을 보면 짧게 흥미를 보인다. 친해져도 말이 길어지거나 다정해지지 않고, 행동으로만 조금 챙긴다.","r":"단테: 관리자라 마지못해 따르는 정도. 동료 수감자들: 대체로 관심 없음. 다만 아군을 해치는 일은 하지 않는다.","h":"반말","c":"너","inferred":[],"aff0":20,"minor":false,"ban":[]},{"id":"meursault","name":"뫼르소","en":["Meursault"],"faction":"lcb","color":"#2f4aa0","order":5,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 5번 수감자. 표정 변화가 거의 없는 덩치 큰 남성. 지시와 규칙에 충실하고, 말을 문자 그대로 받아들인다. 감정을 드러내지 않아 무심해 보이지만 맡은 일은 정확히 해낸다.","s":"합쇼체. 「~입니다」「~습니다」「알겠습니다」. 짧고 건조한 평서문. 감탄사나 꾸밈말이 거의 없다.","t":"누구에게나 똑같이 담담하고 정중하다. 농담을 진지하게 받아 버리기도 한다. 친해져도 말투와 표정은 그대로.","r":"단테: 관리자의 지시를 그대로 따른다. 동료 수감자들: 감정 없이 사실대로 대한다. 누구도 일부러 깎아내리지 않는다.","h":"합쇼체","c":"{name} 씨","inferred":["주인공 호칭({name} 씨) — 추정"],"aff0":20,"minor":false,"ban":[]},{"id":"honglu","name":"홍루","en":["Hong Lu","HongLu"],"faction":"lcb","color":"#3fd1b8","order":6,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 6번 수감자. 명문가 출신의 느긋한 도련님. 늘 웃는 얼굴로 세상일에 호기심을 보이고, 세상 물정에 어두운 듯한 말을 하지만 속내는 잘 드러내지 않는다.","s":"해요체. 「~요」「~네요」「~잖아요」. 부드럽고 여유로운 어조, 느긋한 감탄(와아, 흥미롭네요). 반말로 바뀌지 않는다.","t":"처음 보는 사람에게도 상냥하고 친근하다. 다툼을 웃으며 넘기려 한다. 친해져도 해요체를 유지한다.","r":"단테: 관리자로 친근하게 따른다. 히스클리프·이스마엘 등 동료: 다투면 웃으며 말린다. 가문 이야기: 웃으며 말을 돌린다.","h":"해요체","c":"{name} 씨","inferred":["주인공 호칭({name} 씨) — 추정"],"aff0":20,"minor":false,"ban":[]},{"id":"heathcliff","name":"히스클리프","en":["Heathcliff"],"faction":"lcb","color":"#5b3a8c","order":7,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 7번 수감자. 성질 급하고 거친 청년. 툭하면 시비조로 말하고 주먹부터 나가지만, 의외로 정이 있다. 「캐서린」이라는 사람에 대한 깊은 집착과 상처를 안고 있다.","s":"거친 반말. 「~냐?」「~라고!」「뭐야」, 가벼운 욕설(빌어먹을, 젠장 정도). 존댓말을 쓰지 않는다. 노골적인 비속어는 쓰지 않는다.","t":"처음 보는 사람에게도 퉁명스럽고 공격적이다. 인정한 상대에겐 툴툴대며 챙긴다. 친해져도 거친 반말은 그대로.","r":"단테: 투덜대면서도 따른다. 이스마엘: 자주 말다툼한다. 캐서린: 건드리면 크게 화를 낸다.","h":"반말","c":"너","inferred":[],"aff0":20,"minor":false,"ban":[]},{"id":"ishmael","name":"이스마엘","en":["Ishmael"],"faction":"lcb","color":"#f08a24","order":8,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 8번 수감자. 냉철하고 현실적인 여성. 상식인 역할로 동료들의 엉뚱한 행동에 날카롭게 지적한다. 과거 피쿼드호의 선원으로 에이햅 선장 아래에서 겪은 일로 깊은 상처가 있으며, 고래·바다·광적인 집착에 민감하다.","s":"반말. 「~해」「~잖아」「됐어」. 짧고 단호한 지적, 한숨 섞인 말투. 존댓말을 쓰지 않는다.","t":"처음 보는 사람에게도 경계하며 직설적이다. 믿을 만하다고 판단하면 은근히 챙긴다. 친해져도 반말은 그대로.","r":"단테: 반말로 대하지만 관리자로 인정한다. 히스클리프: 자주 티격태격한다. 에이햅·피쿼드호: 떠올리기 싫어한다.","h":"반말","c":"{name}","inferred":[],"aff0":20,"minor":false,"ban":[]},{"id":"rodion","name":"로쟈","en":["Rodion","Rodya","Rodia"],"faction":"lcb","color":"#8c1c1c","order":9,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 9번 수감자. 밝고 장난스러운 여성. 친근하게 들러붙고 농담을 잘하지만, 도박 빚 같은 사연이 있고 속은 생각보다 깊다.","s":"밝은 반말. 「~잖아~」「~라구!」「헤헤」. 말끝을 늘이거나 애교 섞인 감탄이 많다. 존댓말을 쓰지 않는다.","t":"처음 보는 사람에게도 금방 친한 척 다가간다. 분위기가 무거우면 농담으로 풀려 한다. 친해져도 말투는 그대로이며, 진지한 순간엔 말수가 줄어든다.","r":"단테: 친근하게 대하며 잘 챙긴다. 동료 수감자들: 누구와도 잘 어울린다. 돈 문제: 얼버무린다.","h":"반말","c":"{name}","inferred":[],"aff0":20,"minor":false,"ban":[]},{"id":"sinclair","name":"싱클레어","en":["Sinclair"],"faction":"lcb","color":"#a0ad2a","order":10,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","minor":true,"p":"LCB 10번 수감자. 수감자 중 가장 어린 소년. 소심하고 겁이 많아 자주 사과하지만, 스스로 강해지고 싶어 한다. 착하고 남을 걱정한다.","s":"해요체. 「~요」「죄, 죄송해요」「그, 그게…」. 말을 더듬거나 머뭇거림이 잦다. 반말을 쓰지 않는다.","t":"처음 보는 사람에게 긴장하며 공손하다. 칭찬받으면 크게 당황한다. 친해져도 해요체는 유지한다.","r":"단테: 의지하고 존댓말로 따른다. 그레고르: 잘 챙겨 주는 어른으로 여긴다. 히스클리프·료슈: 조금 무서워한다.","h":"해요체","c":"{name} 씨","inferred":["주인공 호칭({name} 씨) — 추정"],"aff0":20,"ban":[]},{"id":"outis","name":"오티스","en":["Outis"],"faction":"lcb","color":"#3f6b47","order":11,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 11번 수감자. 군인 출신의 냉정한 전략가. 상관(관리자)에게 깍듯하고 공을 세우는 데 집착한다. 동료를 장기말처럼 계산하는 면도 있다.","s":"군대식 합쇼체. 「~입니다」「알겠습니다」「보고드립니다」. 간결하고 딱딱하다. 반말을 쓰지 않는다.","t":"상위자로 보이는 사람에겐 깍듯하고, 처음 보는 이에겐 신중하게 정중하다. 친해져도 군대식 존댓말은 그대로.","r":"단테: 상관으로 모시며 충성을 보인다. 동료 수감자들: 전력으로 평가한다. 하지만 아군을 대놓고 모욕하지 않는다.","h":"합쇼체","c":"{name} 님","inferred":["주인공 호칭({name} 님) — 추정"],"aff0":20,"minor":false,"ban":[]},{"id":"gregor","name":"그레고르","en":["Gregor"],"faction":"lcb","color":"#7a4a1e","order":12,"src":"림버스 컴퍼니 한국어판 게임 내 스토리·인격 대사의 인상을 바탕으로 한 요약 (원문 대사 미인용)","p":"LCB 12번 수감자. 담배를 즐기는 느긋한 아저씨. 담배 전쟁에 참전했던 군인으로, G사의 신체 개조로 한쪽 팔이 벌레의 것처럼 변해 있다. 자조적인 농담을 하지만 사람이 좋고 어린 동료를 챙긴다.","s":"느긋한 반말. 「~냐」「~지 뭐」「어이」. 한숨 섞인 농담, 아저씨 같은 말투. 존댓말을 쓰지 않는다.","t":"처음 보는 사람에게도 편하게 말을 건다. 무거운 이야기는 농담으로 넘긴다. 친해져도 말투는 그대로.","r":"단테: 반말이지만 관리자로 믿는다. 싱클레어: 어린애라 각별히 챙긴다. 담배 전쟁·G사 시절: 씁쓸하게 웃으며 짧게만 말한다.","h":"반말","c":"{name}","inferred":[],"aff0":20,"minor":false,"ban":[]},{"id":"vergiliu /* ───────── 입력 분리: 행동(*별표*) / 말("따옴표") ───────── */
function splitInput(t) {
  const acts = [], says = [];
  let rest = t.replace(/\*([^*]+)\*/g, (_, a) => (acts.push(a.trim()), ' '))
              .replace(/["“]([^"”]+)["”]/g, (_, s) => (says.push(s.trim()), ' '));
  rest = rest.replace(/\s+/g, ' ').trim();
  if (rest) {
    // 표시 없는 글: 「~다.」로 끝나는 서술은 행동, 나머지는 말로 본다
    if (/(다|었다|았다|했다|한다|간다|본다)[.!…]*$/.test(rest) && !/[?？]$/.test(rest)) acts.push(rest); else says.push(rest);
  }
  return { acts, says };
}
function fmtUser(t) {
  const { acts, says } = splitInput(t);
  const out = [];
  if (acts.length) out.push('[주인공의 행동] ' + acts.join(' / '));
  if (says.length) out.push('[주인공의 말] ' + says.map(s => `"${s}"`).join(' '));
  return out.join('\n') || t;
}

/* ───────── AI 응답 해석 ───────── */
const TAG_RE = /\[(호감도|장면)\s+([^\]]*)\]/g;
function extractTags(text) {
  const aff = [], scenes = [];
  const body = text.replace(TAG_RE, (_, k, v) => {
    if (k === '호감도') for (const part of v.split(/[,\s]+(?=[^:\s]+:)/)) {
      const m = part.match(/^\s*([^:]+?)\s*:\s*([+-]?\d+)/); if (m) aff.push([m[1], +m[2]]);
    } else scenes.push(v);
    return '';
  }).replace(/\n{3,}/g, '\n\n').trim();
  return { body, aff, scene: scenes.pop() || null };
}
function resolveId(s) { if (!s) return null; s = s.trim(); return NAME2ID[s] || NAME2ID[s.toLowerCase()] || null; }
const LINE_RE = /^\s*(?:\*\*)?([가-힣A-Za-z][가-힣A-Za-z ·.'-]{0,15}?)(?:\*\*)?\s*(?:[(（]\s*([^)）]{1,6})\s*[)）])?\s*[:：]\s*(.+)$/;
function parseAI(text) {
  const out = [];
  for (const raw of String(text).split('\n')) {
    const line = raw.trim(); if (!line) continue;
    const m = line.match(LINE_RE);
    const id = m && resolveId(m[1]);
    if (id) {
      let say = m[3].trim();
      const q = say.match(/^["“](.*)["”]$/s); if (q) say = q[1];
      out.push({ id, emo: (m[2] || '').trim(), say });
    } else {
      const last = out[out.length - 1];
      if (last && !last.id) last.text += '\n' + line; else out.push({ text: line });
    }
  }
  return out;
}

/* ───────── 후처리: 영어 이름·호칭 변형·'너' 교정 ───────── */
function postprocess(body) {
  // 1) 영어 이름·id → 한국어 이름 (서술·대사 모두)
  for (const c of D.characters) {
    for (const e of [...(c.en || []), c.id]) {
      const re = new RegExp(`(^|[^A-Za-z])${e.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![A-Za-z])`, 'gi');
      body = body.replace(re, (_, p) => p + c.name);
    }
  }
  // 2) 대사 줄마다: 존댓말 인물이 '너'·'이름아/야'로 부르면 그 인물의 호칭으로 고친다 (다른 낱말은 건드리지 않음)
  const nm = pname();
  return body.split('\n').map(line => {
    const m = line.match(LINE_RE); const id = m && resolveId(m[1]); const c = id && CH[id];
    if (!c || !POLITE(c.h)) return line;
    const call = callOf(c);
    let say = m[3];
    const map = { '너는': josa(call, '은', '는'), '너를': josa(call, '을', '를'), '너도': call + '도', '너한테': call + '한테', '너에게': call + '에게', '너의': call + '의', '너랑': josa(call, '이랑', '랑'), '네가': josa(call, '이', '가'), '너': call };
    say = say.replace(/(^|[\s"“'‘(])(너는|너를|너도|너한테|너에게|너의|너랑|네가|너)(?=[\s,.!?…~"”'’)]|$)/g, (_, p, w) => p + map[w]);
    if (nm) say = say.replace(new RegExp(`${nm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(아|야)(?=[\\s,.!?…~"”]|$)`, 'g'), call);
    return line.slice(0, line.length - m[3].length) + say;
  }).join('\n');
}

class AIError extends Error { constructor(msg, fatal) { super(msg); this.fatal = !!fatal; } }
async function failFrom(res) {
  let j = null; try { j = await res.json(); } catch (_) {}
  const msg = (j && (j.error?.message || j.message)) || res.statusText || ('HTTP ' + res.status);
  if (res.status === 401 || res.status === 403) return new AIError('API 키가 거부되었습니다 (' + msg + ')', true);
  if (res.status === 400 && !/model|모델/i.test(msg)) return new AIError('요청 오류: ' + msg, true);
  return new AIError(`${res.status} ${msg}`);
}
async function readSSE(res, onEvent, kick) {
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    kick(); buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).replace(/\r$/, ''); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const d = line.slice(5).trim(); if (!d || d === '[DONE]') continue;
      let j; try { j = JSON.parse(d); } catch (_) { continue; }
      onEvent(j);
    }
  }
}
async function streamOnce(cfg, model, system, messages, onText, maxTokens) {
  const ctl = new AbortController(); abortCtl = ctl;
  let timer = null, timedOut = false;
  const kick = () => { clearTimeout(timer); timer = setTimeout(() => { timedOut = true; ctl.abort(); }, 30000); };
  kick();
  let text = '';
  const add = t => { if (t) { text += t; onText && onText(text); } };
  try {
    let res;
    if (cfg.provider === 'claude') {
      res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', signal: ctl.signal,
        headers: { 'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model, max_tokens: maxTokens, system, messages, stream: true }) });
      if (!res.ok) throw await failFrom(res);
      await readSSE(res, j => {
        if (j.type === 'content_block_delta') add(j.delta?.text);
        else if (j.type === 'error') throw new AIError(j.error?.message || '스트림 오류');
      }, kick);
    } else if (cfg.provider === 'gemini') {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, { method: 'POST', signal: ctl.signal,
        headers: { 'content-type': 'application/json', 'x-goog-api-key': cfg.key },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: maxTokens } }) });
      if (!res.ok) throw await failFrom(res);
      await readSSE(res, j => { for (const p of j.candidates?.[0]?.content?.parts || []) if (!p.thought) add(p.text); }, kick);
    } else {
      const base = (cfg.base || 'https://api.openai.com/v1').replace(/\/+$/, '');
      res = await fetch(base + '/chat/completions', { method: 'POST', signal: ctl.signal,
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.key },
        body: JSON.stringify({ model, stream: true, messages: [{ role: 'system', content: system }, ...messages] }) });
      if (!res.ok) throw await failFrom(res);
      await readSSE(res, j => add(j.choices?.[0]?.delta?.content), kick);
    }
  } catch (e) {
    if (e instanceof AIError) throw e;
    if (timedOut) throw new AIError('30초 동안 응답이 없음');
    if (e.name === 'AbortError') throw new AIError('중단됨', true);
    throw new AIError('연결 실패: ' + e.message);
  } finally { clearTimeout(timer); abortCtl = null; }
  if (!text.trim()) throw new AIError('빈 응답');
  return text;
}
async function callAI({ system, messages, onText, onSwitch, maxTokens = 1800 }) {
  const cfg = aiCfg();
  if (!cfg.key) throw new AIError('AI 설정에서 API 키를 먼저 넣어 주세요.', true);
  let last;
  for (const m of modelChain(cfg)) {
    try { return { text: await streamOnce(cfg, m, system, messages, onText, maxTokens), model: m }; }
    catch (e) { last = e; if (e.fatal) throw e; onSwitch && onSwitch(m, e.message); }
  }
  throw last;
}

/* ───────── 대화 이력 → API 메시지 ───────── */
function apiMessages(room, extraUser) {
  const out = [];
  const push = (role, content) => { const l = out[out.length - 1]; if (l && l.role === role) l.content += '\n\n' + content; else out.push({ role, content }); };
  for (const m of room.msgs.slice(room.sumIdx)) {
    if (m.role === 'user') push('user', fmtUser(m.text));
    else if (m.role === 'ai') {
      if (out.length && out[out.length - 1].role === 'assistant') push('user', '(계속)');
      push('assistant', m.text);
    }
  }
  if (extraUser) push('user', extraUser);
  if (!out.length || out[0].role !== 'user') out.unshift({ role: 'user', content: '(장면 시작)' });
  if (out[out.length - 1].role !== 'user') push('user', '(계속)');
  out[out.length - 1].content += sceneMemo(room);
  return out;
}

/* ───────── 대화방 ───────── */
function settingsFP(room) {
  const ids = [...new Set([...(room.cast || []), ...(room.mode === 'free' ? LOC(room.loc)?.chars || [] : [])])];
  return hash(JSON.stringify(ids.map(id => CH[id] && [CH[id].p, CH[id].s, CH[id].t, CH[id].r, CH[id].h, CH[id].c])));
}
function newRoom(o) {
  const room = { id: uid(), created: Date.now(), updated: Date.now(), mode: o.mode, title: o.title, loc: o.loc, role: o.role || profile.role,
    cast: o.cast || [], premise: o.premise || '', outfit: o.outfit || '', situation: o.situation || '',
    msgs: [], summary: '', sumIdx: 0, aff: {}, met: [], scene: { place: LOC(o.loc)?.name || '', time: o.time || '낮', present: o.present || [] }, fpNotice: 0 };
  room.fp = settingsFP(room);
  for (const id of room.cast) meet(room, id);
  if (o.opening) room.msgs.push({ id: uid(), role: 'ai', text: o.opening, t: Date.now(), opening: true });
  rooms.unshift(room); saveRooms();
  openRoom(room.id);
}
function meet(room, id) {
  if (!CH[id]) return;
  if (!room.met.includes(id)) room.met.push(id);
  if (room.aff[id] == null) room.aff[id] = CH[id].aff0;
}
function applyTags(room, tags) {
  for (const [who, n] of tags.aff) {
    const id = resolveId(who); if (!id) continue;
    meet(room, id);
    room.aff[id] = Math.max(0, Math.min(100, room.aff[id] + Math.max(-3, Math.min(3, n))));
  }
  if (tags.scene) {
    const [place, time, pres] = tags.scene.split('|').map(s => (s || '').trim());
    if (place) room.scene.place = place;
    if (time && D.world.times.includes(time)) room.scene.time = time;
    if (pres != null) {
      const ids = pres.replace(/^등장\s*/, '').split(/[,\s·]+/).map(resolveId).filter(Boolean);
      room.scene.present = [...new Set(ids)];
      ids.forEach(id => meet(room, id));
    }
  }
}

  const el = e.target.closest('[data-mid]'); if (!el) return;
  const i = cur.msgs.findIndex(m => m.id === el.dataset.mid), m = cur.msgs[i];
  if (!act) { if (m.role === 'sys' || busy) return; selMsg = selMsg === m.id ? null : m.id; const st = $('#log').scrollTop; renderChat(); $('#log').scrollTop = st; return; }
  const a = act.dataset.act;
  if (a === 'retry') { cur.msgs.splice(i, 1); return generate(); }
  if (busy) return;
  if (a === 'copy') { navigator.clipboard?.writeText(m.text); selMsg = null; renderChat(); return; }
  if (a === 'edit') return editModal(m);
  if (a === 'del') { removeFrom(i, 1); selMsg = null; renderChat(); return; }
  if (a === 'rewind') { removeFrom(i + 1, cur.msgs.length - i - 1); selMsg = null; renderChat(true); return; }
  if (a === 'regen') { removeFrom(i, 1); selMsg = null; renderChat(true); return generate(); }
};
// 메시지를 지우면 그 답장이 바꾼 호감도·장면도 되돌린다
function removeFrom(i, n) {
  const gone = cur.msgs.splice(i, n);
  const firstAi = gone.find(m => m.role === 'ai' && m.before);
  if (firstAi) { cur.aff = { ...firstAi.before.aff }; cur.scene = JSON.parse(JSON.stringify(firstAi.before.scene)); cur.met = [...firstAi.before.met]; }
  const removedBeforeSum = Math.max(0, Math.min(cur.sumIdx, i + n) - i);
  cur.sumIdx -= removedBeforeSum;
  cur.updated = Date.now(); saveRooms();
}
function editModal(m) {
  modal(`<h3>메시지 편집</h3><textarea id="eTxt" rows="10">${esc(m.text)}</textarea>
    <p class="muted" style="font-size:12.5px">AI 답장은 「이름(감정): "대사"」 줄과 서술 문단으로 이루어져 있습니다.</p>
    <div class="actions"><button class="btn" data-x>취소</button><button class="btn primary" id="eOk">저장</button></div>`, b => {
    b.querySelector('[data-x]').onclick = closeModal;
    b.querySelector('#eOk').onclick = () => { const t = b.querySelector('#eTxt').value.trim(); if (t) { m.text = t; m.edited = true; } closeModal(); selMsg = null; cur.updated = Date.now(); saveRooms(); renderChat(); };
  });
}

/* ───────── 보내기 · 생성 ───────── */
const inp = $('#inp');
function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(180, inp.scrollHeight) + 'px'; }
inp.addEventListener('input', autosize);
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });
function wrapSel(a, b) {
  const s = inp.selectionStart, e = inp.selectionEnd, v = inp.value, mid = v.slice(s, e);
  inp.value = v.slice(0, s) + a + mid + b + v.slice(e);
  inp.focus(); const pos = mid ? s + a.length + mid.length + b.length : s + a.length; inp.setSelectionRange(pos, pos); autosize();
}
$('#qSay').onclick = () => wrapSel('"', '"');
$('#qAct').onclick = () => wrapSel('*', '*');
$('#sendBtn').onclick = () => busy ? abortCtl && abortCtl.abort() : send();
$('#contBtn').onclick = () => { if (!busy) generate('[이어서] (주인공은 잠시 말없이 지켜본다. 주인공의 말·행동은 만들지 말고 장면을 자연스럽게 이어서 써 주세요.)'); };

function send() {
  const t = inp.value.trim(); if (!t || busy || !cur) return;
  cur.msgs = cur.msgs.filter(m => !(m.role === 'sys' && m.retry));
  cur.msgs.push({ id: uid(), role: 'user', text: t, t: Date.now() });
  inp.value = ''; autosize(); selMsg = null;
  cur.updated = Date.now(); saveRooms(); renderChat(true);
  generate();
}
function setBusy(b) { busy = b; $('#sendBtn').textContent = b ? '■ 중단' : '보내기'; $('#contBtn').disabled = b; }
async function generate(extra) {
  if (busy || !cur) return;
  const room = cur;
  setBusy(true);
  const box = $('#logInner');
  const live = document.createElement('div'); live.className = 'msg aimsg';
  live.innerHTML = '<div class="typing">답장을 쓰는 중</div>';
  box.appendChild(live);
  live.scrollIntoView({ block: 'start', behavior: 'smooth' });
  let follow = false;
  try {
    const system = sysPrompt(room), messages = apiMessages(room, extra);
    const { text, model } = await callAI({ system, messages,
      onText: t => {
        if (cur !== room) return;
        const shown = t.replace(TAG_RE, '').replace(/\[[^\]]*$/, '');
        const stick = follow && nearBottom();
        live.innerHTML = aiHTML(postprocess(shown)) + '<div class="typing"></div>';
        if (live.getBoundingClientRect().bottom > $('#log').getBoundingClientRect().bottom) follow = true;
        if (stick) $('#log').scrollTop = $('#log').scrollHeight;
      },
      onSwitch: (m, why) => { if (cur === room) live.innerHTML = `<div class="typing">${esc(m)}: ${esc(why)} → 다른 모델로 전환하는 중</div>`; } });
    const tags = extractTags(text);
    const before = { aff: { ...room.aff }, scene: JSON.parse(JSON.stringify(room.scene)), met: [...room.met] };
    applyTags(room, tags);
    // 대사에 나온 인물도 만난 사람으로
    const body = postprocess(tags.body);
    for (const b of parseAI(body)) if (b.id) meet(room, b.id);
    room.msgs.push({ id: uid(), role: 'ai', text: body, t: Date.now(), model, before, cont: !!extra });
    if (room.fpNotice > 0) room.fpNotice--;
    room.updated = Date.now(); saveRooms();
  } catch (e) {
    room.msgs.push({ id: uid(), role: 'sys', text: e.message === '중단됨' ? '답장을 중단했습니다.' : '응답을 받지 못했습니다: ' + e.message, err: e.message !== '중단됨', retry: true, t: Date.now() });
    saveRooms();
  }
  setBusy(false);
  if (cur === room) {
    const st = $('#log').scrollTop; renderChat();
    $('#log').scrollTop = st;
    const el = $('#logInner').lastElementChild; if (el && !follow) el.scrollIntoView({ block: 'start' });
  }
  maybeSummarize(room);
}

/* ───────── 자동 요약: 안 요약된 메시지가 30개를 넘으면 최근 12개만 원문 유지 ───────── */
async function maybeSummarize(room) {
  const real = room.msgs.length - room.sumIdx;
  if (real <= 30 || room.summarizing) return;
  const end = room.msgs.length - 12;
  const chunk = room.msgs.slice(room.sumIdx, end).filter(m => m.role !== 'sys');
  const log = chunk.map(m => m.role === 'user' ? `${pname() || '주인공'}: ${m.text}` : parseAI(m.text).map(b => b.id ? `${CH[b.id].name}: ${b.say}` : b.text).join('\n')).join('\n');
  room.summarizing = true;
  try {
    const { text } = await callAI({ maxTokens: 900,
      system: '당신은 롤플레이 대화 기록을 요약하는 도우미입니다. 다음 대화에 꼭 필요한 사실(일어난 사건, 장소 이동, 주인공이 한 약속·선택, 인물들과의 관계 변화, 받은 물건, 남은 떡밥)을 한국어로 간결하게 정리하세요. 대사를 옮겨 적지 말고 사건 위주로, 15줄 이내.',
      messages: [{ role: 'user', content: (room.summary ? `[이전 요약]\n${room.summary}\n\n` : '') + `[새로 요약할 대화]\n${log}\n\n위 내용을 이전 요약과 합쳐 하나의 요약으로 다시 써 주세요.` }] });
    if (rooms.includes(room) && room.msgs.length >= end) { room.summary = text.trim(); room.sumIdx = end; saveRooms(); if (cur === room) renderChat(); }
  } catch (_) { /* 다음 턴에 다시 시도 */ }
  room.summarizing = false;
}

/* ───────── 대화방 메뉴 · 프로필 ───────── */
$('#roomMenuBtn').onclick = () => {
  modal(`<h3>${esc(cur.title)}</h3>
    <div class="list">
      <button class="card" data-m="rename"><b>이름 바꾸기</b></button>
      <button class="card" data-m="summary"><b>기억(요약) 보기·고치기</b><small>${cur.summary ? esc(cur.summary.slice(0, 60)) + '…' : '아직 요약 없음'}</small></button>
      <button class="card" data-m="profile"><b>주인공 설정</b><small>${esc(pname())} · 이 방의 신분: ${esc(cur.role)}</small></button>
      <button class="card" data-m="delete"><b style="color:var(--accent)">대화방 삭제</b></button>
    </div><div class="actions"><button class="btn" data-x>닫기</button></div>`, b => {
    b.querySelector('[data-x]').onclick = closeModal;
    b.querySelectorAll('[data-m]').forEach(x => x.onclick = () => {
      const k = x.dataset.m;
      if (k === 'rename') { const t = prompt('대화방 이름', cur.title); if (t && t.trim()) { cur.title = t.trim(); saveRooms(); renderHeader(); } closeModal(); }
      if (k === 'summary') modal(`<h3>기억(요약)</h3><textarea id="sTxt" rows="12">${esc(cur.summary)}</textarea><div class="actions"><button class="btn" data-x>취소</button><button class="btn primary" id="sOk">저장</button></div>`, c => {
        c.querySelector('[data-x]').onclick = closeModal;
        c.querySelector('#sOk').onclick = () => { cur.summary = c.querySelector('#sTxt').value.trim(); saveRooms(); closeModal(); };
      });
      if (k === 'profile') { closeModal(); profileModal(); }
      if (k === 'delete') { if (confirm('이 대화방을 지울까요? 되돌릴 수 없습니다.')) { rooms = rooms.filter(r => r !== cur); saveRooms(); closeModal(); goHome(); } }
    });
  });
};
$('#cast').onclick = e => {
  const b = e.target.closest('[data-prof]'); if (!b) return;
  const c = CH[b.dataset.prof], a = cur.aff[c.id] ?? c.aff0;
  modal(`<h3 style="display:flex;align-items:center;gap:10px">${avatar(c.id, 40)} ${esc(c.name)}</h3>
    <div class="muted">${esc(FAC(c.faction)?.name || '')} · 호감도 ${a}/100 (${affStage(a)})</div>
    <dl class="prof"><dt>성격</dt><dd>${esc(c.p)}</dd><dt>말투 · ${esc(c.h)}</dt><dd>${esc(c.s)}</dd><dt>나를 부르는 말</dt><dd>${esc(callOf(c))}</dd><dt>관계</dt><dd>${esc(c.r)}</dd></dl>
    ${c.inferred.length ? `<div class="flag">추정으로 채운 부분: ${c.inferred.map(esc).join(' / ')}</div>` : ''}
    <div class="actions"><button class="btn" data-x>닫기</button></div>`, m => m.querySelector('[data-x]').onclick = closeModal);
};

/* ───────── AI 설정 ───────── */
$('#setBtn').onclick = () => {
  const c = aiCfg();
  modal(`<h3>⚙ AI 설정</h3>
    <label>서비스</label><select id="aProv">${Object.entries(PROV).map(([k, p]) => `<option value="${k}" ${k === c.provider ? 'selected' : ''}>${p.label}</option>`).join('')}</select>
    <label>API 키 (이 브라우저에만 저장)</label><input id="aKey" type="password" autocomplete="off" value="${esc(c.key)}">
    <label id="aBaseL">API 주소 (OpenAI 호환, 선택)</label><input id="aBase" value="${esc(c.base)}" placeholder="https://api.openai.com/v1">
    <label>모델</label><div style="display:flex;gap:6px"><select id="aModel"></select><button class="btn small" id="aLoad">목록 불러오기</button></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="aFb" style="width:auto" ${c.fallback !== false ? 'checked' : ''}> 한도·시간 초과(30초) 시 다른 모델로 자동 전환</label>
    <p class="muted" id="aMsg" style="font-size:12.5px"></p>
    <div class="actions"><button class="btn" id="aDel">키 지우기</button><button class="btn" data-x>닫기</button><button class="btn primary" id="aOk">저장</button></div>`, b => {
    let models = c.models || [];
    const fill = () => {
      const pv = b.querySelector('#aProv').value, list = [...new Set([...(pv === c.provider ? models : []), ...PROV[pv].models])];
      b.querySelector('#aModel').innerHTML = list.map(m => `<option ${m === c.model ? 'selected' : ''}>${esc(m)}</option>`).join('');
      b.querySelector('#aKey').placeholder = PROV[pv].hint;
      b.querySelector('#aBase').classList.toggle('hidden', pv !== 'openai'); b.querySelector('#aBaseL').classList.toggle('hidden', pv !== 'openai');
    };
    fill();
    b.querySelector('#aProv').onchange = () => { models = []; fill(); };
    b.querySelector('[data-x]').onclick = closeModal;
    b.querySelector('#aDel').onclick = () => { LS.set(AI_KEY, { ...aiCfg(), key: '' }); b.querySelector('#aKey').value = ''; b.querySelector('#aMsg').textContent = '키를 지웠습니다.'; };
    b.querySelector('#aLoad').onclick = async () => {
      const pv = b.querySelector('#aProv').value, key = b.querySelector('#aKey').value.trim(), msg = b.querySelector('#aMsg');
      if (!key) return msg.textContent = '키를 먼저 넣어 주세요.';
      msg.textContent = '불러오는 중…';
      try {
        let r, j;
        if (pv === 'claude') { r = await fetch('https://api.anthropic.com/v1/models?limit=100', { headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } }); j = await r.json(); models = (j.data || []).map(m => m.id); }
        else if (pv === 'gemini') { r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } }); j = await r.json(); models = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/.test(m.name) && !/embedding|image|tts|audio|live/i.test(m.name)).map(m => m.name.replace(/^models\//, '')); }
        else { r = await fetch((b.querySelector('#aBase').value.trim() || 'https://api.openai.com/v1').replace(/\/+$/, '') + '/models', { headers: { authorization: 'Bearer ' + key } }); j = await r.json(); models = (j.data || []).map(m => m.id); }
        if (!r.ok) throw new Error(j.error?.message || r.status);
        c.provider = pv; fill(); msg.textContent = `모델 ${models.length}개를 불러왔습니다.`;
      } catch (e) { msg.textContent = '불러오지 못했습니다: ' + e.message; }
    };
    b.querySelector('#aOk').onclick = () => {
      const pv = b.querySelector('#aProv').value;
      LS.set(AI_KEY, { provider: pv, key: b.querySelector('#aKey').value.trim(), base: b.querySelector('#aBase').value.trim(), model: b.querySelector('#aModel').value, models, fallback: b.querySelector('#aFb').checked });
      closeModal(); if (cur) renderChat();
    };
  });
};

/* ───────── 내보내기 · 가져오기 (API 키는 포함하지 않음) ───────── */
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'pmc-chat', v: 1, profile, rooms }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `city-chat-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#importBtn').onclick = () => {
  const f = document.createElement('input'); f.type = 'file'; f.accept = 'application/json,.json';
  f.onchange = async () => {
    try {
      const j = JSON.parse(await f.files[0].text());
      if (j.app !== 'pmc-chat' || !Array.isArray(j.rooms)) throw new Error('도시 채팅 파일이 아닙니다');
      const have = new Set(rooms.map(r => r.id));
      const add = j.rooms.filter(r => r && r.id && Array.isArray(r.msgs) && !have.has(r.id));
      rooms = [...add, ...rooms]; saveRooms();
      if (!pname() && j.profile?.name) { profile = j.profile; LS.set(PROF_KEY, profile); }
      renderHome(); alert(`대화방 ${add.length}개를 가져왔습니다.`);
    } catch (e) { alert('가져오지 못했습니다: ' + e.message); }
  };
  f.click();
};

/* ───────── 시작 ───────── */
async function boot() {
  if (!D) {   // 개발용: 빌드 전 template.html을 직접 열었을 때
    const get = n => fetch('../data/' + n).then(r => r.json());
    const [world, factions, scenarios, characters] = await Promise.all(['world.json', 'factions.json', 'scenarios.json', 'characters.json'].map(get));
    D = { world, factions, scenarios, characters };
  }
  indexData();
  renderHome();
}
boot();
</script>
